# Render blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Free plan: the disk is wiped on every restart, deploy and sleep (after 15 minutes idle), so
# tickets, notes and OSINT results are temporary. The accounts in ADMIN_* / ANALYST_* are
# created again at every start. Values marked "sync: false" are asked for in the dashboard;
# they never go in this file.
services:
  - type: web
    name: soc-triage-playbook
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/soc.db
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: AI_PROVIDER
        value: none
      - key: SEED_SAMPLE_DATA
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        sync: false
      - key: ANALYST_USERNAME
        sync: false
      - key: ANALYST_PASSWORD
        sync: false
      - key: ANALYST_DISPLAY_NAME
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: URLSCAN_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      - key: OTX_API_KEY
        sync: false
      - key: SCREENSHOTBASE_API_KEY
        sync: false
